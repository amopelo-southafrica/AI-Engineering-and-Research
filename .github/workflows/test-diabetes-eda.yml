name: Test diabetes EDA input and notebook

on:
  push:
    paths:
      - 'Data-Analytics/visualising-diabetes-patterns/**'
      - '.github/workflows/test-diabetes-eda.yml'
  pull_request:
    paths:
      - 'Data-Analytics/visualising-diabetes-patterns/**'
      - '.github/workflows/test-diabetes-eda.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test data integrity and notebook syntax
        run: python -m unittest discover -s Data-Analytics/visualising-diabetes-patterns/tests -p 'test_*.py' -v
