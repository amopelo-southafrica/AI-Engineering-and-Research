ize="12.3">Third class</text><rect x="222" y="258" width="111.5" height="27" fill="#567C93"/><text x="341.5" y="275" font-size="11.8">24.2% (n=491)</text><text x="211" y="322" text-anchor="end" font-size="12.3">Children under 16*</text><rect x="222" y="306" width="271.6" height="27" fill="#8499A6"/><text x="501.6" y="323" font-size="11.8">59.0% (n=83)</text><text x="211" y="370" text-anchor="end" font-size="12.3">Age 16+*</text><rect x="222" y="354" width="175.7" height="27" fill="#8499A6"/><text x="405.7" y="371" font-size="11.8">38.2% (n=631)</text><text x="380" y="454" text-anchor="middle" font-size="10" fill="#444">*Age categories use 714 records with known ages.</text></g></svg>