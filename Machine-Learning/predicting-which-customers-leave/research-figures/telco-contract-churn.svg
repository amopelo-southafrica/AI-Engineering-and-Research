<svg xmlns="http://www.w3.org/2000/svg" width="750" height="340" viewBox="0 0 750 340"><rect width="750" height="340" fill="#fff"/><g font-family="Inter,Arial,sans-serif"><text x="375" y="27" fill="#000" font-size="17" font-weight="600" text-anchor="middle">Observed churn by contract category</text><line x1="250" y1="58" x2="250" y2="265" stroke="#E5E5E5"/><text x="250" y="286" fill="#000" font-size="12" text-anchor="middle">0%</text><line x1="332.5" y1="58" x2="332.5" y2="265" stroke="#E5E5E5"/><text x="332.5" y="286" fill="#000" font-size="12" text-anchor="middle">10%</text><line x1="415" y1="58" x2="415" y2="265" stroke="#E5E5E5"/><text x="415" y="286" fill="#000" font-size="12" text-anchor="middle">20%</text><line x1="497.5" y1="58" x2="497.5" y2="265" stroke="#E5E5E5"/><text x="497.5" y="286" fill="#000" font-size="12" text-anchor="middle">30%</text><line x1="580" y1="58" x2="580" y2="265" stroke="#E5E5E5"/><text x="580" y="286" fill="#000" font-size="12" text-anchor="middle">40%</text><line x1="662.5" y1="58" x2="662.5" y2="265" stroke="#E5E5E5"/><text x="662.5" y="286" fill="#000" font-size="12" text-anchor="middle">50%</text><text x="238" y="95" fill="#000" font-size="13" text-anchor="end">Month-to-month</text><rect x="250" y="78" width="352.35" height="30" fill="#355D79"/><text x="610.35" y="98" font-size="12" fill="#000">42.7% (1655/3875)</text><text x="238" y="155" fill="#000" font-size="13" text-anchor="end">One-year</text><rect x="250" y="138" width="93.04" height="30" fill="#355D79"/><text x="351.04" y="158" font-size="12" fill="#000">11.3% (166/1472)</text><text x="238" y="215" fill="#000" font-size="13" text-anchor="end">Two-year</text><rect x="250" y="198" width="23.50" height="30" fill="#355D79"/><text x="281.50" y="218" font-size="12" fill="#000">2.8% (48/1685)</text><text x="375" y="324" fill="#000" text-anchor="middle" font-size="11.5">Rates are descriptive and are not adjusted for other customer characteristics.</text></g></svg>