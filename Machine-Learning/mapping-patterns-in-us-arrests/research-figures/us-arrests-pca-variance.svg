<svg xmlns="http://www.w3.org/2000/svg" width="730" height="390" viewBox="0 0 730 390"><rect width="730" height="390" fill="white"/><g font-family="Inter,Arial,sans-serif"><text x="365" y="28" font-size="16" font-weight="600" text-anchor="middle" fill="#000">Variance explained by principal components</text><line x1="90" y1="314" x2="690" y2="314" stroke="#EEE"/><text x="77" y="318" text-anchor="end" font-size="11" fill="#000">0%</text><line x1="90" y1="278" x2="690" y2="278" stroke="#EEE"/><text x="77" y="282" text-anchor="end" font-size="11" fill="#000">10%</text><line x1="90" y1="242" x2="690" y2="242" stroke="#EEE"/><text x="77" y="246" text-anchor="end" font-size="11" fill="#000">20%</text><line x1="90" y1="206" x2="690" y2="206" stroke="#EEE"/><text x="77" y="210" text-anchor="end" font-size="11" fill="#000">30%</text><line x1="90" y1="170" x2="690" y2="170" stroke="#EEE"/><text x="77" y="174" text-anchor="end" font-size="11" fill="#000">40%</text><line x1="90" y1="134" x2="690" y2="134" stroke="#EEE"/><text x="77" y="138" text-anchor="end" font-size="11" fill="#000">50%</text><line x1="90" y1="98" x2="690" y2="98" stroke="#EEE"/><text x="77" y="102" text-anchor="end" font-size="11" fill="#000">60%</text><line x1="90" y1="62" x2="690" y2="62" stroke="#EEE"/><text x="77" y="66" text-anchor="end" font-size="11" fill="#000">70%</text><rect x="146" y="90.8" width="74" height="223.2" fill="#355D79"/><text x="183" y="78.8" font-size="12" text-anchor="middle" fill="#000">62.01%</text><text x="183" y="339" font-size="12" text-anchor="middle" fill="#000">PC1</text><rect x="284" y="224.9" width="74" height="89.1" fill="#355D79"/><text x="321" y="212.9" font-size="12" text-anchor="middle" fill="#000">24.74%</text><text x="321" y="339" font-size="12" text-anchor="middle" fill="#000">PC2</text><rect x="422" y="281.9" width="74" height="32.1" fill="#355D79"/><text x="459" y="269.9" font-size="12" text-anchor="middle" fill="#000">8.91%</text><text x="459" y="339" font-size="1